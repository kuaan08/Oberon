name: Oberon Extended Mobile Android
on:
  push:
    branches: [feature/oberon-extended-mobile]
    paths:
      - 'mobile/**'
      - '.github/workflows/oberon-extended-mobile.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Unit tests and Android debug APK
        working-directory: mobile
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug
      - name: Verify APK
        run: |
          test -s mobile/app/build/outputs/apk/debug/app-debug.apk
          mkdir -p artifacts
          cp mobile/app/build/outputs/apk/debug/app-debug.apk artifacts/Oberon_Extended_Mobile_Android_alpha1.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Oberon_Extended_Mobile_Android_Debug_APK
          path: artifacts/Oberon_Extended_Mobile_Android_alpha1.apk
          retention-days: 30
          if-no-files-found: error
