plugins {
    id 'com.android.application'
}
android {
    namespace 'io.github.katakishi0.oberonextended.mobile'
    compileSdk 35
    defaultConfig {
        applicationId 'io.github.katakishi0.oberonextended.mobile'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '0.2.0-alpha.2'
    }
    buildTypes {
        release {
            minifyEnabled false
            // A real production release must use a private signing key.
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
}
